name: OpenSSF Scorecard

# Continuously measures the supply-chain controls this repository relies on - pinned
# actions, scoped token permissions, branch protection, signed releases, dependency
# update tooling - so a regression (an unpinned action, a widened permission) is caught
# rather than noticed years later.

on:
  branch_protection_rule:
  schedule:
    # Weekly. Scorecard checks repository configuration, which changes independently of
    # the code, so a push trigger would mostly re-measure the same thing.
    - cron: "17 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Publish the results to the Security tab.
      security-events: write
      # Needed by the action to read branch protection settings.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Not published to the public API, so no repo_token beyond the default is
          # needed and the results stay visible only in the Security tab.
          publish_results: false

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
