name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Without an explicit block the job inherits the repository default, which on
# older repositories is read-write for GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs: a tag like v4 is mutable and can be
      # repointed at arbitrary code by the action owner or a compromised
      # maintainer account. Dependabot keeps the SHAs and comments current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave GITHUB_TOKEN in .git/config
          # where any later step can read it.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Locked mode fails if a committed packages.lock.json does not match the project's
      # dependency graph, so a dependency cannot change without the lock file changing in
      # the same pull request.
      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # NuGetAudit warnings during restore are non-blocking, so a known-
      # vulnerable transitive package would otherwise ship unnoticed.
      - name: Check for vulnerable dependencies
        run: |
          set -o pipefail
          output="$(dotnet list package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -qE '^\s+> '; then
            echo "::error::Vulnerable packages found - see the listing above."
            exit 1
          fi

      - name: Pack
        run: dotnet pack --no-build -c Release -o ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
