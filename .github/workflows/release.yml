name: Release

on:
  release:
    types: [published]

# Nothing at workflow level: each job asks for exactly what it needs. Only `publish`
# holds the credentials that can change anything outside this run.
permissions: {}

env:
  # The one list of packages in a release, in publish order: each after the ones it depends on
  # (KeyVaultReferenceResolver depends on CertificateStoreCredential, HashiCorp on the resolver).
  # A glob would push in file-name order and could publish a package before its dependency.
  PACKAGE_IDS: CertificateStoreCredential KeyVaultReferenceResolver KeyVaultReferenceResolver.HashiCorp

jobs:
  # Builds, tests and packs with no credentials in scope. Everything that executes project
  # code - restore targets, the compiler, the test assemblies, the SBOM tool - runs here,
  # where the job token is read-only and there is no OIDC token to mint.
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave GITHUB_TOKEN in .git/config where any
          # later step - including anything a restored package contributes to the build -
          # could read it.
          persist-credentials: false

      # The release tag and the csproj <Version> are maintained by hand, so a mismatch
      # would publish a package version that does not match the tag. NuGet does not allow
      # true deletion, so fail before anything is pushed.
      - name: Verify tag matches package version
        env:
          # Passed via env rather than interpolated into the script: tag names can legally
          # contain shell metacharacters, which would splice into the run block.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          # The tag names the KeyVaultReferenceResolver release. CertificateStoreCredential has its own
          # version and is not tagged separately; it is published first, see the publish job.
          csproj="src/KeyVaultReferenceResolver/KeyVaultReferenceResolver.csproj"
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")"
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from $csproj"
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match <Version> '$version' in $csproj (expected tag 'v$version')"
            exit 1
          fi
          echo "Tag '$tag' matches package version '$version'."

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build -c Release -o ./artifacts

      # Three packages are released together. KeyVaultReferenceResolver depends on
      # CertificateStoreCredential, which is versioned on its own, so a release that is missing
      # it would publish a package whose dependency does not exist on nuget.org.
      - name: Verify the release contains every package
        run: |
          set -euo pipefail
          for id in $PACKAGE_IDS; do
            files=(./artifacts/"$id".[0-9]*.nupkg)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::Expected exactly one package for $id in ./artifacts"
              ls ./artifacts
              exit 1
            fi
            echo "Found ${files[0]}"
          done

      # KeyVaultReferenceResolver names the CertificateStoreCredential version range it needs. The
      # range is derived from the project at pack time, hooking a private SDK target, so check what
      # was actually packed: the CertificateStoreCredential built here must satisfy it, and the
      # range must be bounded. Otherwise nuget.org would receive a package that cannot be restored.
      - name: Verify the dependency range of the packed resolver
        run: |
          set -euo pipefail
          dep=(./artifacts/CertificateStoreCredential.[0-9]*.nupkg)
          res=(./artifacts/KeyVaultReferenceResolver.[0-9]*.nupkg)
          dep_version="$(basename "${dep[0]}" .nupkg)"
          dep_version="${dep_version#CertificateStoreCredential.}"
          range="$(unzip -p "${res[0]}" KeyVaultReferenceResolver.nuspec             | grep -oP '<dependency id="CertificateStoreCredential" version="\K[^"]+')"
          echo "CertificateStoreCredential $dep_version, resolver requires $range"
          if ! [[ "$range" =~ ^\[([0-9.]+),\ *([0-9.]+)\)$ ]]; then
            echo "::error::Expected a bounded range [lower, upper) for CertificateStoreCredential, got '$range'"
            exit 1
          fi
          lower="${BASH_REMATCH[1]}"
          upper="${BASH_REMATCH[2]}"
          if [ "$(printf '%s
%s
' "$lower" "$dep_version" | sort -V | head -n1)" != "$lower" ]              || [ "$(printf '%s
%s
' "$dep_version" "$upper" | sort -V | head -n1)" != "$dep_version" ]              || [ "$dep_version" = "$upper" ]; then
            echo "::error::CertificateStoreCredential $dep_version is outside the range $range the resolver requires"
            exit 1
          fi

      # An SBOM lets a consumer enumerate the transitive closure - Azure.Identity, VaultSharp
      # and everything under them - without restoring the package themselves.
      - name: Generate SBOM
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dotnet tool restore
          dotnet dotnet-CycloneDX KeyVaultReferenceResolver.slnx \
            --output ./sbom \
            --filename KeyVaultReferenceResolver-sbom.cdx.json \
            --output-format Json \
            --exclude-test-projects \
            --exclude-dev \
            --set-version "$version"

      # Two named artifacts rather than one with several path patterns. A multi-path upload
      # reconstructs directory structure relative to the least common ancestor of the paths,
      # which is a rule the publish job would silently depend on - and the publish job runs
      # only during a release, so a change in that rule would surface after the approval
      # click. A name per artifact plus an explicit download path makes the layout on the
      # other side something this workflow states rather than infers.
      - name: Upload packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom
          path: ./sbom/KeyVaultReferenceResolver-sbom.cdx.json
          if-no-files-found: error

  # Signs and publishes. This job holds id-token: write and contents: write but never runs
  # project code: it only consumes the artifacts the build job produced.
  publish:
    needs: build
    runs-on: ubuntu-latest

    # A protected environment gates the only job that can publish. As configured:
    #
    #   required reviewers      gijswalraven
    #   deployment tag rule     v*
    #
    # The tag rule matters because a release deployment's ref is the tag, not a branch
    # (GET .../deployments?environment=nuget-production shows ref: v1.4.0), so without it
    # the environment could be targeted from any branch. Creating a release is therefore
    # not by itself sufficient to push a package to nuget.org.
    #
    # Read the live configuration back with:
    #   gh api repos/gijswalraven/KeyVaultReferenceResolver/environments/nuget-production
    #   gh api repos/gijswalraven/KeyVaultReferenceResolver/environments/nuget-production/deployment-branch-policies
    #
    # prevent_self_review is off, and there is one reviewer who is also the person who
    # cuts the release. The gate forces a deliberate second action; it is not separation
    # of duties, and should not be described as such.
    environment: nuget-production

    permissions:
      packages: write
      # Needed to upload the SBOM as a release asset.
      contents: write
      # Lets the job request the OIDC token that NuGet Trusted Publishing exchanges for a
      # short-lived API key. The same token backs the build provenance attestation.
      id-token: write
      # Lets the job record a provenance attestation against the published packages.
      attestations: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: packages
          path: ./artifacts

      - name: Download SBOM
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sbom
          path: ./sbom

      # No checkout in this job, so the SDK is set up explicitly rather than relying on
      # whatever version the runner image happens to ship.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Provenance links each package to this repository, this workflow and this commit, so a
      # consumer can verify with `gh attestation verify <file> --repo <owner>/<repo>` that the
      # package on nuget.org was built here and not uploaded from somewhere else.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "./artifacts/*.nupkg"

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "./sbom/KeyVaultReferenceResolver-sbom.cdx.json"

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job, so gh has no git remote to infer the repository from.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./sbom/KeyVaultReferenceResolver-sbom.cdx.json --clobber

      # Trusted Publishing: exchange this job's OIDC token for a short-lived nuget.org API
      # key, so no long-lived secret is stored in the repo. The temporary key is valid for
      # one hour, so this runs immediately before the push rather than earlier in the job.
      # Requires a matching policy on nuget.org (Account -> Trusted Publishing) for owner
      # gijswalraven, repo KeyVaultReferenceResolver, workflow release.yml.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # nuget.org profile name, not an email address. Public information -- it is the
          # listed owner of the packages -- so it is not a secret.
          user: GijsWalraven

      # Fixed order, each package after the ones it depends on: CertificateStoreCredential, then
      # KeyVaultReferenceResolver (which depends on it), then KeyVaultReferenceResolver.HashiCorp
      # (which depends on KeyVaultReferenceResolver). A glob would push in file-name order and could
      # publish a package before its dependency. --skip-duplicate makes a release that does not bump
      # CertificateStoreCredential skip it instead of failing.
      - name: Publish to NuGet.org
        run: |
          set -euo pipefail
          for id in $PACKAGE_IDS; do
            files=(./artifacts/"$id".[0-9]*.nupkg)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::Expected exactly one package for $id in ./artifacts"
              exit 1
            fi
            dotnet nuget push "${files[0]}" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          set -euo pipefail
          for id in $PACKAGE_IDS; do
            files=(./artifacts/"$id".[0-9]*.nupkg)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::Expected exactly one package for $id in ./artifacts"
              exit 1
            fi
            dotnet nuget push "${files[0]}" --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/$REPOSITORY_OWNER/index.json" --skip-duplicate
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
