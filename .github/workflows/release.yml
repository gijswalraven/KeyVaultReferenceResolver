name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    # A protected environment gates the only job that can publish. Configure it with
    # required reviewers and a tag-pattern deployment branch rule, so creating a release
    # is not by itself sufficient to push a package to nuget.org.
    environment: nuget-production

    permissions:
      packages: write
      # Needed to upload the SBOM as a release asset.
      contents: write
      # Lets the job request the OIDC token that NuGet Trusted Publishing
      # exchanges for a short-lived API key. Without this the login step fails.
      # The same token backs the build provenance attestation.
      id-token: write
      # Lets the job record a provenance attestation against the published packages.
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The release tag and the csproj <Version> are maintained by hand, so a
      # mismatch would publish a package version that does not match the tag.
      # NuGet does not allow true deletion, so fail before anything is pushed.
      - name: Verify tag matches package version
        env:
          # Passed via env rather than interpolated into the script: tag names can
          # legally contain shell metacharacters, which would splice into the run block.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          csproj="src/KeyVaultReferenceResolver/KeyVaultReferenceResolver.csproj"
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")"
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from $csproj"
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match <Version> '$version' in $csproj (expected tag 'v$version')"
            exit 1
          fi
          echo "Tag '$tag' matches package version '$version'."

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build -c Release -o ./artifacts

      # Provenance links each package to this repository, this workflow and this commit, so a
      # consumer can verify with `gh attestation verify <file> --repo <owner>/<repo>` that the
      # package on nuget.org was built here and not uploaded from somewhere else.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "./artifacts/*.nupkg"

      # An SBOM lets a consumer enumerate the transitive closure - Azure.Identity, VaultSharp
      # and everything under them - without restoring the package themselves.
      - name: Generate SBOM
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dotnet tool restore
          dotnet dotnet-CycloneDX KeyVaultReferenceResolver.sln \
            --output ./sbom \
            --filename KeyVaultReferenceResolver-sbom.cdx.json \
            --output-format Json \
            --exclude-test-projects \
            --exclude-dev \
            --set-version "$version"

      - name: Attest SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "./sbom/KeyVaultReferenceResolver-sbom.cdx.json"

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./sbom/KeyVaultReferenceResolver-sbom.cdx.json --clobber

      # Trusted Publishing: exchange this job's OIDC token for a short-lived
      # nuget.org API key, so no long-lived secret is stored in the repo.
      # The temporary key is valid for one hour, so this runs immediately
      # before the push rather than earlier in the job.
      # Requires a matching policy on nuget.org (Account -> Trusted Publishing)
      # for owner gijswalraven, repo KeyVaultReferenceResolver, workflow release.yml.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # nuget.org profile name, not an email address. Public information --
          # it is the listed owner of the packages -- so it is not a secret.
          user: GijsWalraven

      - name: Publish to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/$REPOSITORY_OWNER/index.json" --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
