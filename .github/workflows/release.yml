name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The release tag and the csproj <Version> are maintained by hand, so a
      # mismatch would publish a package version that does not match the tag.
      # NuGet does not allow true deletion, so fail before anything is pushed.
      - name: Verify tag matches package version
        run: |
          tag="${{ github.event.release.tag_name }}"
          csproj="src/KeyVaultReferenceResolver/KeyVaultReferenceResolver.csproj"
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")"
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from $csproj"
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match <Version> '$version' in $csproj (expected tag 'v$version')"
            exit 1
          fi
          echo "Tag '$tag' matches package version '$version'."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack --no-build -c Release -o ./artifacts

      - name: Publish to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
