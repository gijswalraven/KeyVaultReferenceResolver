name: Verify attestation action

# Temporary. actions/attest-build-provenance was bumped v2 -> v4 in f1ebe83, but it
# appears only in release.yml, which never runs on a pull request - so nothing has
# exercised the new major version. Finding out during a release means finding out after
# the approval click, with a half-finished publish.
#
# This runs the same two attest steps the release does, against a real pack, and stops
# short of publishing anything. Delete it once it has passed; it is a one-off check, not
# a workflow worth keeping green forever.

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The two permissions the attest step actually needs. No packages: write and no
      # environment, so this cannot publish even by accident.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: |
          dotnet restore --locked-mode
          dotnet pack -c Release -o ./artifacts

      # Mirrors the release job: one attest over a glob matching several files, one over
      # a single file. Both shapes are used in release.yml and both are worth proving.
      - name: Attest packages (glob subject)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "./artifacts/*.nupkg"

      - name: Produce a single-file subject
        run: |
          mkdir -p ./sbom
          dotnet tool restore
          dotnet dotnet-CycloneDX KeyVaultReferenceResolver.sln \
            --output ./sbom \
            --filename KeyVaultReferenceResolver-sbom.cdx.json \
            --output-format Json \
            --exclude-test-projects \
            --exclude-dev \
            --set-version 0.0.0-attest-check

      - name: Attest SBOM (single-file subject)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "./sbom/KeyVaultReferenceResolver-sbom.cdx.json"
